name: Apply React effect lint migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fix-react-effect-lint.mjs"
      - ".github/workflows/apply-react-effect-lint.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply deterministic migration
        run: node scripts/fix-react-effect-lint.mjs
      - name: Validate frontend lint
        working-directory: app
        run: |
          yarn install --frozen-lockfile
          yarn lint
      - name: Commit migrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/app/dashboard/page.tsx \
                  app/src/components/erp/purchases/index.tsx \
                  app/src/components/erp/shared/nested-core-editors.tsx \
                  app/src/components/erp/shared/nested-resource-editors.tsx \
                  app/src/components/erp/shared/person-contacts-editor.tsx \
                  app/src/components/erp/shared/record-workspace.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: comply with React effect lint rules"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
