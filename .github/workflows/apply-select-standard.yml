name: Apply canonical select migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/migrate-select-standard.mjs"
      - ".github/workflows/apply-select-standard.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply deterministic migration
        run: node scripts/migrate-select-standard.mjs
      - name: Commit migrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/components/erp/armament-query/index.tsx app/src/components/erp/purchases/index.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: finish canonical select migration"
            git push origin HEAD:main
          fi
