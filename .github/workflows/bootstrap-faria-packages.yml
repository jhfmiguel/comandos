name: Bootstrap Faria Miguel packages

on:
  push:
    branches:
      - migration/shared-product-ui-step-12
    paths:
      - ".github/workflows/bootstrap-faria-packages.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical Faria Miguel
        uses: actions/checkout@v5
        with:
          repository: jhfmiguel/faria-miguel
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: '@jhfmiguel'

      - name: Publish physical NPM packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          physical_name() {
            local logical="$1"
            local base="${logical#@faria-miguel/}"
            printf '@jhfmiguel/faria-miguel-%s' "$base"
          }

          rewrite_manifest() {
            local manifest="$1"
            node - "$manifest" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          const logicalName = manifest.name;
          const base = logicalName.slice("@faria-miguel/".length);
          manifest.name = `@jhfmiguel/faria-miguel-${base}`;
          manifest.repository = {type:"git",url:"https://github.com/jhfmiguel/faria-miguel.git"};
          manifest.publishConfig = {...(manifest.publishConfig??{}),registry:"https://npm.pkg.github.com"};
          manifest.fariaMiguelLogicalName = logicalName;
          for (const section of ["dependencies","devDependencies","optionalDependencies"]) {
            const deps = manifest[section];
            if (!deps) continue;
            for (const [name, version] of Object.entries(deps)) {
              if (!name.startsWith("@faria-miguel/")) continue;
              const depBase = name.slice("@faria-miguel/".length);
              deps[name] = `npm:@jhfmiguel/faria-miguel-${depBase}@${version}`;
            }
          }
          fs.writeFileSync(path, JSON.stringify(manifest,null,2)+"\n");
          NODE
          }

          for manifest in frontend/packages/*/package.json; do
            is_private="$(node -p "require('./${manifest}').private === true")"
            [[ "$is_private" == "true" ]] && continue
            logical_name="$(node -p "require('./${manifest}').name")"
            package_version="$(node -p "require('./${manifest}').version")"
            package_name="$(physical_name "$logical_name")"
            if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists"
              continue
            fi
            work_dir="$(mktemp -d)"
            cp -R "$(dirname "$manifest")"/. "$work_dir"/
            rewrite_manifest "$work_dir/package.json"
            npm publish "$work_dir" --registry=https://npm.pkg.github.com
            rm -rf "$work_dir"
          done
