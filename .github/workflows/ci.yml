name: CI

on:
  push:
    branches: [main, migration/modular-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test API
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - name: Install
        working-directory: app
        run: yarn install --frozen-lockfile
      - name: Lint
        working-directory: app
        run: yarn lint
      - name: Build
        working-directory: app
        env:
          NODE_ENV: production
        run: yarn build
