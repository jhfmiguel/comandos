name: CI

on:
  push:
    branches: [main, migration/modular-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout canonical Faria Miguel foundation
        uses: actions/checkout@v5
        with:
          repository: jhfmiguel/faria-miguel
          ref: main
          path: faria-miguel
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install canonical Faria Miguel artifacts
        run: mvn -B -ntp -f faria-miguel/pom.xml -DskipTests install
      - name: Validate product-consumer boundary
        run: bash scripts/validate-product-boundary.sh
      - name: Verify API against canonical Faria Miguel artifacts
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - name: Install
        working-directory: app
        run: yarn install --frozen-lockfile
      - name: License policy
        working-directory: app
        run: yarn licenses:audit
      - name: Platform boundary audit
        working-directory: app
        run: yarn platform:audit
      - name: Lint
        working-directory: app
        run: yarn lint
      - name: Build
        working-directory: app
        env:
          NODE_ENV: production
        run: yarn build

  armament-browser:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: comandos
          APP_USER_PASSWORD: comandos
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: Checkout canonical Faria Miguel foundation
        uses: actions/checkout@v5
        with:
          repository: jhfmiguel/faria-miguel
          ref: main
          path: faria-miguel
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install canonical Faria Miguel artifacts
        run: mvn -B -ntp -f faria-miguel/pom.xml -DskipTests install
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - name: Install frontend
        working-directory: app
        run: yarn install --frozen-lockfile
      - name: Install Chromium
        working-directory: app
        run: yarn playwright install --with-deps chromium
      - name: Start demo API on Oracle
        working-directory: api
        env:
          ORACLE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          ORACLE_USERNAME: comandos
          ORACLE_PASSWORD: comandos
          JPA_DDL_AUTO: create
          FLYWAY_ENABLED: "false"
          SPRING_SQL_INIT_MODE: never
        run: |
          chmod +x mvnw
          nohup ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo,oracle -Dspring-boot.run.arguments=--server.port=8180 > /tmp/comandos-api.log 2>&1 &
      - name: Wait for API and Oracle business regression verification
        run: |
          for i in {1..120}; do
            if curl -fsS http://localhost:8180/actuator/health; then
              echo "Oracle demo API is healthy and all startup business regression verifiers completed."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/comandos-api.log
          exit 1
      - name: Build frontend
        working-directory: app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8180
        run: yarn build
      - name: Start frontend
        working-directory: app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8180
        run: nohup yarn start > /tmp/comandos-app.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            curl -fsS http://localhost:3000 && exit 0
            sleep 2
          done
          cat /tmp/comandos-app.log
          exit 1
      - name: Browser smoke validation
        working-directory: app
        env:
          COMANDOS_API_URL: http://localhost:8180
          COMANDOS_APP_URL: http://localhost:3000
        run: yarn validate:armamento

  software-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout canonical Faria Miguel foundation
        uses: actions/checkout@v5
        with:
          repository: jhfmiguel/faria-miguel
          ref: main
          path: faria-miguel
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install canonical Faria Miguel artifacts
        run: mvn -B -ntp -f faria-miguel/pom.xml -DskipTests install
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - name: Install frontend with Yarn
        working-directory: app
        run: yarn install --frozen-lockfile
      - name: Generate frontend CycloneDX SBOM
        run: |
          mkdir -p artifacts
          cd app
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file ../artifacts/frontend-bom.json
      - name: Generate backend CycloneDX SBOM
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeBom -Dcyclonedx.outputFormat=json
          cp target/bom.json ../artifacts/backend-bom.json
      - name: Audit SBOM licenses
        run: node scripts/check-sbom-licenses.mjs artifacts/frontend-bom.json artifacts/backend-bom.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comandos-sbom
          path: |
            artifacts/frontend-bom.json
            artifacts/backend-bom.json
          if-no-files-found: error
          retention-days: 30
