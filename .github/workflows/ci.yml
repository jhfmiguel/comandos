name: CI

on:
  push:
    branches: [main, migration/modular-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Validate product-consumer boundary
        run: bash scripts/validate-product-boundary.sh

      - name: Check canonical Faria Miguel artifacts
        id: foundation
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bash scripts/check-faria-miguel-artifacts.sh api/pom.xml; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify COMANDOS API against canonical Faria Miguel artifacts
        if: steps.foundation.outputs.available == 'true'
        working-directory: api
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p ../artifacts
          chmod +x mvnw
          ./mvnw -U verify 2>&1 | tee ../artifacts/backend-maven.log

      - name: Record unavailable canonical backend dependency
        if: steps.foundation.outputs.available != 'true'
        run: |
          echo "::warning::Faria Miguel 0.1.0-SNAPSHOT is not fully available to this repository through GitHub Packages. Backend compilation was not executed remotely."
          {
            echo "### Backend verification deferred"
            echo
            echo "The COMANDOS product boundary passed, but the canonical Faria Miguel Maven artifacts are not available to this repository."
            echo
            echo "Run the canonical local verification after installing Faria Miguel into the local Maven repository:"
            echo
            echo '~~~powershell'
            echo 'cd C:\workspace\faria-miguel\faria-miguel'
            echo 'mvn -DskipTests install'
            echo 'cd C:\workspace\faria-miguel\comandos\api'
            echo '.\mvnw verify'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            artifacts/backend-maven.log
            api/target/surefire-reports/**
            api/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - name: Check canonical Faria Miguel frontend packages
        id: frontend_foundation
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bash scripts/check-faria-miguel-frontend-packages.sh; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record unavailable canonical frontend dependency
        if: steps.frontend_foundation.outputs.available != 'true'
        run: |
          echo "::warning::Canonical Faria Miguel frontend packages are unavailable from GitHub Packages. Frontend install/lint/build are deferred."
          {
            echo "### Frontend verification deferred"
            echo
            echo "The canonical @jhfmiguel/faria-miguel-platform and/or @jhfmiguel/faria-miguel-ui packages are not published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        if: steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        run: yarn install --frozen-lockfile
      - name: License policy
        if: steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        run: yarn licenses:audit
      - name: Platform boundary audit
        if: steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        run: yarn platform:audit
      - name: Lint
        if: steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        run: yarn lint
      - name: Build
        if: steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        env:
          NODE_ENV: production
        run: yarn build

  armament-browser:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: comandos
          APP_USER_PASSWORD: comandos
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Check canonical Faria Miguel artifacts
        id: foundation
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bash scripts/check-faria-miguel-artifacts.sh api/pom.xml; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check canonical Faria Miguel frontend packages
        id: frontend_foundation
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bash scripts/check-faria-miguel-frontend-packages.sh; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record deferred browser regression
        if: steps.foundation.outputs.available != 'true' || steps.frontend_foundation.outputs.available != 'true'
        run: |
          echo "::warning::Armament browser regression was deferred because the canonical Faria Miguel backend artifacts are not available to this repository."
          echo "### Armament browser regression deferred" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical Faria Miguel Maven artifacts are required before the Oracle-backed API can start." >> "$GITHUB_STEP_SUMMARY"

      - name: Install frontend
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        run: yarn playwright install --with-deps chromium

      - name: Start demo API on Oracle
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        working-directory: api
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORACLE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          ORACLE_USERNAME: comandos
          ORACLE_PASSWORD: comandos
          JPA_DDL_AUTO: create
          FLYWAY_ENABLED: "false"
          SPRING_SQL_INIT_MODE: never
        run: |
          chmod +x mvnw
          nohup ./mvnw -U spring-boot:run -Dspring-boot.run.profiles=demo,oracle -Dspring-boot.run.arguments=--server.port=8180 > /tmp/comandos-api.log 2>&1 &

      - name: Wait for API and Oracle business regression verification
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        run: |
          for i in {1..120}; do
            if curl -fsS http://localhost:8180/actuator/health; then
              echo "Oracle demo API is healthy and all startup business regression verifiers completed."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/comandos-api.log
          exit 1

      - name: Build frontend
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8180
        run: yarn build

      - name: Start frontend
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8180
        run: nohup yarn start > /tmp/comandos-app.log 2>&1 &

      - name: Wait for frontend
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        run: |
          for i in {1..60}; do
            curl -fsS http://localhost:3000 && exit 0
            sleep 2
          done
          cat /tmp/comandos-app.log
          exit 1

      - name: Browser smoke validation
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        env:
          COMANDOS_API_URL: http://localhost:8180
          COMANDOS_APP_URL: http://localhost:3000
        run: yarn validate:armamento

  software-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Check canonical Faria Miguel artifacts
        id: foundation
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bash scripts/check-faria-miguel-artifacts.sh api/pom.xml; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check canonical Faria Miguel frontend packages
        id: frontend_foundation
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bash scripts/check-faria-miguel-frontend-packages.sh; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend with Yarn
        if: steps.frontend_foundation.outputs.available == 'true'
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Generate frontend CycloneDX SBOM
        if: steps.frontend_foundation.outputs.available == 'true'
        run: |
          mkdir -p artifacts
          cd app
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file ../artifacts/frontend-bom.json

      - name: Generate backend CycloneDX SBOM
        if: steps.foundation.outputs.available == 'true'
        working-directory: api
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -U org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeBom -Dcyclonedx.outputFormat=json
          cp target/bom.json ../artifacts/backend-bom.json

      - name: Audit frontend and backend SBOM licenses
        if: steps.foundation.outputs.available == 'true' && steps.frontend_foundation.outputs.available == 'true'
        run: node scripts/check-sbom-licenses.mjs artifacts/frontend-bom.json artifacts/backend-bom.json

      - name: Audit frontend SBOM licenses
        if: steps.foundation.outputs.available != 'true' && steps.frontend_foundation.outputs.available == 'true'
        run: |
          echo "::warning::Backend SBOM was deferred because canonical Faria Miguel artifacts are unavailable."
          node scripts/check-sbom-licenses.mjs artifacts/frontend-bom.json

      - name: Record unavailable canonical frontend dependency for SBOM
        if: steps.frontend_foundation.outputs.available != 'true'
        run: echo "::warning::Frontend SBOM deferred because canonical Faria Miguel frontend packages are unavailable."

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comandos-sbom
          path: |
            artifacts/frontend-bom.json
            artifacts/backend-bom.json
          if-no-files-found: warn
          retention-days: 30
