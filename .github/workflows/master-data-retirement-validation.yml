name: Master Data retirement validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/master-data-retirement-validation.yml"
      - "api/src/main/java/com/comandos/core/service/**"
      - "api/src/main/resources/application.properties"
      - "api/pom.xml"
      - "architecture/step-21-duplicate-retirement.json"
      - "architecture/step-21-master-data-retirement.json"
      - "architecture/master-data-foreign-keys.json"
      - "scripts/check-faria-miguel-artifacts.sh"
      - "scripts/oracle-step-21-retirement-audit.sql"
      - "scripts/validate-product-boundary.sh"

permissions:
  contents: read
  packages: read

jobs:
  validate-retirement:
    name: Validate Step 21.12 on Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: comandos
          APP_USER_PASSWORD: comandos
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve canonical Faria Miguel Maven artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FARIA_MIGUEL_READ_TOKEN: ${{ secrets.FARIA_MIGUEL_READ_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/faria-miguel-artifact-resolution.log) 2>&1

          if bash scripts/check-faria-miguel-artifacts.sh api/pom.xml; then
            echo "Canonical Faria Miguel Maven artifacts are available from GitHub Packages."
            exit 0
          fi

          echo "Canonical packages are unavailable; installing the Faria Miguel foundation from source."
          rm -rf /tmp/faria-miguel
          if [[ -n "${FARIA_MIGUEL_READ_TOKEN:-}" ]]; then
            git clone --depth 1 \
              "https://x-access-token:${FARIA_MIGUEL_READ_TOKEN}@github.com/jhfmiguel/faria-miguel.git" \
              /tmp/faria-miguel
          else
            # Public repositories can be cloned without additional credentials.
            # Private repositories still require FARIA_MIGUEL_READ_TOKEN.
            if ! git clone --depth 1 \
                https://github.com/jhfmiguel/faria-miguel.git /tmp/faria-miguel; then
              echo "::error::Foundation repository requires access. Set FARIA_MIGUEL_READ_TOKEN."
              exit 1
            fi
          fi

          mvn -B -ntp -DskipTests \
            -f /tmp/faria-miguel/pom.xml \
            -pl backend/platform,backend/platform-migrations,backend/tenancy,backend/enterprise,backend/enterprise-persistence-jpa,backend/commerce \
            -am install

          bash scripts/check-faria-miguel-artifacts.sh api/pom.xml

      - name: Backfill master data and product references on Oracle
        working-directory: api
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORACLE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          ORACLE_USERNAME: comandos
          ORACLE_PASSWORD: comandos
          JPA_DDL_AUTO: create
          FLYWAY_ENABLED: "false"
          SPRING_SQL_INIT_MODE: never

          COMANDOS_MASTER_DATA_SHADOW_WRITE: "true"
          COMANDOS_MASTER_DATA_READINESS_ON_STARTUP: "true"
          COMANDOS_MASTER_DATA_BACKFILL_ON_STARTUP: "true"
          COMANDOS_MASTER_DATA_PARITY_ON_STARTUP: "true"
          COMANDOS_MASTER_DATA_CANONICAL_READ: "true"
          COMANDOS_MASTER_DATA_PRODUCT_REFERENCE_SHADOW: "true"
          COMANDOS_MASTER_DATA_PRODUCT_REFERENCE_BACKFILL_ON_STARTUP: "true"
          COMANDOS_MASTER_DATA_PRODUCT_REFERENCE_PRIMARY_READ: "true"
          COMANDOS_MASTER_DATA_LEGACY_PRODUCT_ASSOCIATIONS_RETIRED: "true"
          COMANDOS_MASTER_DATA_RETIREMENT_VALIDATION_ON_STARTUP: "false"
        run: |
          set -euo pipefail
          chmod +x mvnw
          nohup ./mvnw -U spring-boot:run \
            -Dspring-boot.run.profiles=demo,oracle \
            -Dspring-boot.run.arguments=--server.port=8180 \
            > /tmp/comandos-master-data-backfill.log 2>&1 &
          echo $! > /tmp/comandos-master-data-backfill.pid

          for i in {1..180}; do
            if grep -q "product-reference parity consistent=true" /tmp/comandos-master-data-backfill.log 2>/dev/null; then
              echo "Master-data and product-reference backfill phase completed."
              break
            fi
            if ! kill -0 "$(cat /tmp/comandos-master-data-backfill.pid)" 2>/dev/null; then
              echo "COMANDOS exited during backfill."
              cat /tmp/comandos-master-data-backfill.log
              exit 1
            fi
            if [[ "$i" == 180 ]]; then
              echo "Timed out waiting for backfill parity."
              cat /tmp/comandos-master-data-backfill.log
              exit 1
            fi
            sleep 2
          done

          kill "$(cat /tmp/comandos-master-data-backfill.pid)" 2>/dev/null || true
          for i in {1..30}; do
            if ! kill -0 "$(cat /tmp/comandos-master-data-backfill.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done

      - name: Start COMANDOS for read-only retirement validation
        working-directory: api
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORACLE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          ORACLE_USERNAME: comandos
          ORACLE_PASSWORD: comandos
          JPA_DDL_AUTO: update
          FLYWAY_ENABLED: "false"
          SPRING_SQL_INIT_MODE: never

          COMANDOS_MASTER_DATA_SHADOW_WRITE: "true"
          COMANDOS_MASTER_DATA_READINESS_ON_STARTUP: "true"
          COMANDOS_MASTER_DATA_BACKFILL_ON_STARTUP: "false"
          COMANDOS_MASTER_DATA_PARITY_ON_STARTUP: "true"
          COMANDOS_MASTER_DATA_CANONICAL_READ: "true"
          COMANDOS_MASTER_DATA_PRODUCT_REFERENCE_SHADOW: "true"
          COMANDOS_MASTER_DATA_PRODUCT_REFERENCE_BACKFILL_ON_STARTUP: "false"
          COMANDOS_MASTER_DATA_PRODUCT_REFERENCE_PRIMARY_READ: "true"
          COMANDOS_MASTER_DATA_LEGACY_PRODUCT_ASSOCIATIONS_RETIRED: "true"
          COMANDOS_MASTER_DATA_RETIREMENT_VALIDATION_ON_STARTUP: "true"
        run: |
          set -euo pipefail
          chmod +x mvnw
          nohup ./mvnw -U spring-boot:run \
            -Dspring-boot.run.profiles=demo,oracle \
            -Dspring-boot.run.arguments=--server.port=8180 \
            > /tmp/comandos-master-data-retirement.log 2>&1 &
          echo $! > /tmp/comandos-master-data-retirement.pid

      - name: Require retirement gate PASS
        run: |
          set -euo pipefail
          for i in {1..180}; do
            if grep -q "legacy persistence retirement gate=PASS" /tmp/comandos-master-data-retirement.log 2>/dev/null; then
              # CI uses seeded Oracle product data: an empty parity report is
              # not valid retirement evidence in this seeded environment.
              product_checked="$(sed -nE 's/.*product-reference parity consistent=true, checked=([0-9]+).*/\1/p' /tmp/comandos-master-data-retirement.log | tail -1)"
              if [[ -z "$product_checked" || "$product_checked" -eq 0 ]]; then
                echo "::error::Retirement gate emitted no nonempty seeded-product parity evidence."
                cat /tmp/comandos-master-data-retirement.log
                exit 1
              fi
              echo "Step 21.12 retirement gate passed; seeded product references checked=$product_checked."
              cat /tmp/comandos-master-data-retirement.log
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/comandos-master-data-retirement.pid)" 2>/dev/null; then
              echo "COMANDOS exited before the Step 21.12 retirement gate passed."
              cat /tmp/comandos-master-data-retirement.log
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for the Step 21.12 retirement gate."
          cat /tmp/comandos-master-data-retirement.log
          exit 1

      - name: Upload retirement validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-data-retirement-validation
          path: |
            /tmp/faria-miguel-artifact-resolution.log
            /tmp/comandos-master-data-backfill.log
            /tmp/comandos-master-data-retirement.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop COMANDOS
        if: always()
        run: |
          if [[ -f /tmp/comandos-master-data-retirement.pid ]]; then
            kill "$(cat /tmp/comandos-master-data-retirement.pid)" 2>/dev/null || true
          fi
