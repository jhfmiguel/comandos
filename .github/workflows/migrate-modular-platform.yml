name: COMANDOS package migration

on:
  push:
    branches:
      - migration/modular-platform
    paths:
      - scripts/migrate-to-comandos.sh
      - .github/workflows/migrate-modular-platform.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/modular-platform
          fetch-depth: 0
      - name: Migrate legacy Java package
        shell: bash
        run: bash scripts/migrate-to-comandos.sh
