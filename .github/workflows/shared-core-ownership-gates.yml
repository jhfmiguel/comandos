name: Faria Miguel automatic architecture gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "app/**"
      - "src/**"
      - "pom.xml"
      - "package.json"
      - "architecture/**"
      - "scripts/faria-miguel-architecture-gates.mjs"
      - ".github/workflows/shared-core-ownership-gates.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "app/**"
      - "src/**"
      - "pom.xml"
      - "package.json"
      - "architecture/**"
      - "scripts/faria-miguel-architecture-gates.mjs"
      - ".github/workflows/shared-core-ownership-gates.yml"

permissions:
  contents: read

jobs:
  architecture-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout product
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Faria Miguel architecture gates
        run: node scripts/faria-miguel-architecture-gates.mjs
