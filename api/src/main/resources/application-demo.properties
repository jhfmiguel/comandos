# DEMO profile: destructive by design.
# Every startup recreates the PostgreSQL schema and loads deterministic sample data.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/weapons}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=false

comandos.demo.enabled=true
