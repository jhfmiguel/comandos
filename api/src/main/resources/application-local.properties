spring.datasource.url=jdbc:h2:mem:comandos-local;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/local/platform-setting.sql
comandos.demo.seed=${COMANDOS_DEMO_SEED:false}
comandos.demo.require-full-coverage=${COMANDOS_DEMO_REQUIRE_FULL_COVERAGE:false}
faria-miguel.infrastructure.messaging.store=memory
