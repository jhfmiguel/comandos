# Activate with: -Dspring.profiles.active=oracle -Poracle
# Oracle is prepared as the target database, but schema cutover stays disabled
# until the PostgreSQL schema/data migration is validated end-to-end.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:comandos}
spring.datasource.password=${ORACLE_PASSWORD:comandos}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=false
