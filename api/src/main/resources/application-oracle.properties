spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:comandos}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# PostgreSQL-era migrations are being replaced by Oracle-native migrations.
# Keep Flyway disabled for the local cutover until the Oracle baseline is complete.
spring.flyway.enabled=${FLYWAY_ENABLED:false}


# Apply idempotent Oracle compatibility DDL before Hibernate schema validation.
# Existing objects are ignored; missing tables/columns are created.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/oracle/compatibility-schema.sql
spring.sql.init.continue-on-error=true
