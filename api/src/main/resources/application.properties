spring.application.name=${APP_NAME:comandos-api}
spring.profiles.default=oracle

# Reusable platform security configuration.
# Legacy ERP_* environment variables remain accepted as fallback during migration.
platform.security.require-login=${erp.security.require-login:${PLATFORM_REQUIRE_LOGIN:${ERP_REQUIRE_LOGIN:false}}}
platform.security.enforce-permissions=${erp.security.enforce-permissions:${PLATFORM_ENFORCE_PERMISSIONS:${ERP_ENFORCE_PERMISSIONS:false}}}
platform.allowed-origin=${erp.allowed-origin:${PLATFORM_ALLOWED_ORIGIN:${ERP_ALLOWED_ORIGIN:http://localhost:3000}}}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true


# Optional fictitious-data seeding. Keep disabled outside development/test.
comandos.demo.seed=${COMANDOS_DEMO_SEED:false}
comandos.demo.require-full-coverage=${COMANDOS_DEMO_REQUIRE_FULL_COVERAGE:false}
comandos.demo.minimum-rows=${COMANDOS_DEMO_MINIMUM_ROWS:3}
