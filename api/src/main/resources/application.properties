spring.application.name=${APP_NAME:comandos-api}
spring.profiles.default=postgresql

# Reusable platform security configuration.
# Legacy ERP_* environment variables remain accepted as fallback during migration.
platform.security.require-login=${PLATFORM_REQUIRE_LOGIN:${ERP_REQUIRE_LOGIN:${erp.security.require-login:false}}}
platform.security.enforce-permissions=${PLATFORM_ENFORCE_PERMISSIONS:${ERP_ENFORCE_PERMISSIONS:${erp.security.enforce-permissions:false}}}
platform.allowed-origin=${PLATFORM_ALLOWED_ORIGIN:${ERP_ALLOWED_ORIGIN:${erp.allowed-origin:http://localhost:3000}}}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
