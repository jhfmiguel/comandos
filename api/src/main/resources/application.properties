spring.application.name=${APP_NAME:comandos-api}
spring.profiles.default=oracle

# COMANDOS keeps its established erp.* contract while accepting canonical platform.* overrides.
# Environment variables from both generations remain supported during migration.
erp.security.require-login=${platform.security.require-login:${PLATFORM_REQUIRE_LOGIN:${ERP_REQUIRE_LOGIN:false}}}
erp.security.enforce-permissions=${platform.security.enforce-permissions:${PLATFORM_ENFORCE_PERMISSIONS:${ERP_ENFORCE_PERMISSIONS:false}}}
erp.allowed-origin=${platform.allowed-origin:${PLATFORM_ALLOWED_ORIGIN:${ERP_ALLOWED_ORIGIN:http://localhost:3000}}}

# Shared product composition identity. Used by faria-miguel-product-control after migration.
faria-miguel.product-control.product-id=comandos
faria-miguel.product-control.installation-id=${FARIA_MIGUEL_INSTALLATION_ID:${HOSTNAME:comandos-local}}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Optional fictitious-data seeding. Keep disabled outside development/test.
comandos.demo.seed=${COMANDOS_DEMO_SEED:false}
comandos.demo.require-full-coverage=${COMANDOS_DEMO_REQUIRE_FULL_COVERAGE:false}
comandos.demo.minimum-rows=${COMANDOS_DEMO_MINIMUM_ROWS:3}


# Master-data canonical persistence migration.
# Keep disabled until the legacy erp_* dataset has passed canonical compatibility checks.
# When enabled, CREATE/UPDATE writes are mirrored transactionally to Faria Miguel fm_* tables.
comandos.master-data.shadow-write.enabled=${COMANDOS_MASTER_DATA_SHADOW_WRITE:false}
comandos.master-data.readiness-on-startup=${COMANDOS_MASTER_DATA_READINESS_ON_STARTUP:false}
comandos.master-data.backfill-on-startup=${COMANDOS_MASTER_DATA_BACKFILL_ON_STARTUP:false}
comandos.master-data.parity-on-startup=${COMANDOS_MASTER_DATA_PARITY_ON_STARTUP:false}
comandos.master-data.canonical-read.enabled=${COMANDOS_MASTER_DATA_CANONICAL_READ:false}

# Product-domain canonical reference shadowing.
# Keep disabled during normal runtime until the crosswalk is complete; backfill paths may bypass this flag explicitly.
comandos.master-data.product-reference-shadow.enabled=${COMANDOS_MASTER_DATA_PRODUCT_REFERENCE_SHADOW:false}
comandos.master-data.product-reference-backfill-on-startup=${COMANDOS_MASTER_DATA_PRODUCT_REFERENCE_BACKFILL_ON_STARTUP:false}
