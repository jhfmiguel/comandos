spring.application.name=comandos-api
spring.profiles.default=postgresql

# Security is progressively tightened while the legacy UI is migrated.
erp.security.require-login=${ERP_REQUIRE_LOGIN:false}
erp.security.enforce-permissions=${ERP_ENFORCE_PERMISSIONS:false}
erp.allowed-origin=${ERP_ALLOWED_ORIGIN:http://localhost:3000}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
