spring.application.name=comandos-api-tests
spring.datasource.url=jdbc:h2:mem:wr-api-tests;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.root=WARN
logging.level.org.hibernate.SQL=OFF
debug=false

spring.flyway.enabled=false

faria-miguel.consumption.permission-resource=ammunition-consumptions
faria-miguel.product-control.product-id=comandos

spring.jpa.mapping-resources=META-INF/comandos-inventory.orm.xml
