name: faria-miguel

services:
  oracle:
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/free:latest}
    environment:
      ORACLE_PWD: ${ORACLE_SYS_PASSWORD:-OracleDev1}
    ports:
      - "1521:1521"
    volumes:
      - faria-oracle:/opt/oracle/oradata
      - ./oracle/init:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD-SHELL", "echo 'select 1 from dual;' | sqlplus -s system/${ORACLE_SYS_PASSWORD:-OracleDev1}@//localhost:1521/FREEPDB1 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    profiles: ["cache"]
    ports:
      - "6379:6379"

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    profiles: ["messaging"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  faria-oracle:
