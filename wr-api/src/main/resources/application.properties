spring.application.name=wr-api

spring.datasource.url=jdbc:postgresql://localhost:5432/weapons
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway starts the transition from Hibernate-managed schema updates to versioned migrations.
# Baseline 0 lets existing non-empty development databases adopt V1+ migrations safely.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Provision a SystemUser before enabling login enforcement.
erp.security.require-login=${ERP_REQUIRE_LOGIN:false}
erp.security.enforce-permissions=${ERP_ENFORCE_PERMISSIONS:false}
erp.allowed-origin=${ERP_ALLOWED_ORIGIN:http://localhost:3000}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
